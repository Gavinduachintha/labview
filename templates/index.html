<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>LabView · Server overview</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="LabView home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>lab<span class="brand-accent">view</span></span>
      </a>
      <div class="connection" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="connection-label">Connecting</span>
      </div>
    </header>

    <section class="intro">
      <p class="eyebrow">HOMELAB / OVERVIEW</p>
      <h1>Your server,<br><span>at a glance.</span></h1>
      <p class="intro-copy">Live system telemetry from your LabView host.</p>
    </section>

    <section class="metrics" aria-label="Server metrics">
      <article class="metric-card" data-metric="cpu">
        <div class="card-heading">
          <div class="metric-icon cpu-icon" aria-hidden="true">⌁</div>
          <span class="metric-name">PROCESSOR</span>
          <span class="card-index">01</span>
        </div>
        <div class="metric-reading">
          <span class="metric-value" id="cpu-value">--</span><span class="metric-unit">%</span>
        </div>
        <div class="meter"><span id="cpu-meter"></span></div>
        <div class="metric-meta"><span>Utilization</span><span id="cpu-detail">-- MHz</span></div>
      </article>

      <article class="metric-card" data-metric="ram">
        <div class="card-heading">
          <div class="metric-icon ram-icon" aria-hidden="true">▤</div>
          <span class="metric-name">MEMORY</span>
          <span class="card-index">02</span>
        </div>
        <div class="metric-reading">
          <span class="metric-value" id="ram-value">--</span><span class="metric-unit">%</span>
        </div>
        <div class="meter"><span id="ram-meter"></span></div>
        <div class="metric-meta"><span>In use</span><span id="ram-detail">-- / -- GB</span></div>
      </article>

      <article class="metric-card" data-metric="disk">
        <div class="card-heading">
          <div class="metric-icon disk-icon" aria-hidden="true">▰</div>
          <span class="metric-name">STORAGE</span>
          <span class="card-index">03</span>
        </div>
        <div class="metric-reading">
          <span class="metric-value" id="disk-value">--</span><span class="metric-unit">%</span>
        </div>
        <div class="meter"><span id="disk-meter"></span></div>
        <div class="metric-meta"><span>In use</span><span id="disk-detail">-- / -- GB</span></div>
      </article>
    </section>

    <footer class="footer">
      <span><span class="footer-mark"></span> LABVIEW SYSTEM MONITOR</span>
      <span id="updated-at">Waiting for telemetry</span>
    </footer>
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
